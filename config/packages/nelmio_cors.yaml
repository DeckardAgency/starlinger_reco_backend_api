nelmio_cors:
  defaults:
    origin_regex: true
    # Restrict to the configured origins (CORS_ALLOW_ORIGIN in .env / prod env), not '*'.
    allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
    # Required so browsers send/accept the HttpOnly auth cookies cross-origin.
    # (allow_origin must be specific, never '*', when credentials are allowed.)
    allow_credentials: true
    allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
    allow_headers: ['Content-Type', 'Authorization']
    expose_headers: ['Link']
    max_age: 3600
  paths:
    '^/': null
