framework:
    workflows:
        order:
            type: 'state_machine'
            audit_trail:
                enabled: true
            marking_store:
                type: 'method'
                property: 'status'
            supports:
                - App\Entity\Order
            initial_marking: draft
            places:
                - draft
                - submitted
                - confirmed
                - dispatched
                - completed
                - canceled
            transitions:
                submit:
                    from: draft
                    to: submitted
                confirm:
                    from: submitted
                    to: confirmed
                dispatch:
                    from: confirmed
                    to: dispatched
                complete:
                    from: dispatched
                    to: completed
                cancel:
                    from: [draft, submitted, confirmed]
                    to: canceled
