framework:
    rate_limiter:
        # Login endpoint rate limiting - 5 attempts per minute per IP
        login:
            policy: 'sliding_window'
            limit: 5
            interval: '1 minute'

        # Per-username login throttle - blunts credential stuffing across rotating IPs
        login_username:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'

        # Baseline abuse limit for the whole API, enforced per authenticated user (per IP
        # for anonymous traffic) by LoginRateLimitSubscriber. Generous enough for a SPA
        # that fires many requests per page load, low enough to blunt scraping/enumeration.
        api:
            policy: 'sliding_window'
            limit: 300
            interval: '1 minute'

        # Stricter limit for sensitive operations (e.g., password reset)
        sensitive_operations:
            policy: 'sliding_window'
            limit: 3
            interval: '5 minutes'
