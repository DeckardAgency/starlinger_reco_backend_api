api_platform:
    title: Starlinger RECO REST API
    version: 1.0.0
    show_webby: false
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        pagination_items_per_page: 30
        pagination_client_items_per_page: true
    eager_loading:
        max_joins: 50
        enabled: true
        fetch_partial: true
