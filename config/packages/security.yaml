security:
    enable_authenticator_manager: true

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                # No `property`: UserRepository::loadUserByIdentifier resolves the
                # login identifier as email first, then username (both unique).

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login_check
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Truly public auth endpoints. These must NOT sit on the jwt firewall:
        # PUBLIC_ACCESS does not help there, because a present-but-stale BEARER
        # cookie is authenticated (and rejected, 401 "Invalid JWT Token") before
        # access_control is consulted — so password reset / registration broke
        # for any browser still carrying an old cookie.
        public_auth:
            pattern: ^/api/(auth/(forgot-password|reset-password|validate-reset-token)|register$|user_invitations/(verify|complete))
            stateless: true
            security: false

        # Dedicated firewall: the refresh call arrives with an EXPIRED BEARER
        # cookie by definition. On a shared firewall the jwt authenticator
        # rejects that cookie (401) before refresh_jwt ever runs — YAML order
        # does not change authenticator priority — so refresh must live on a
        # firewall that has no jwt authenticator at all.
        refresh:
            pattern: ^/api/token/refresh
            stateless: true
            refresh_jwt: ~

        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        # Public endpoints - these must be listed first
        - { path: ^/api/login_check, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        # API schema/docs are admin-only (not an anonymous recon surface).
        - { path: ^/api/docs, roles: ROLE_ADMIN }
        - { path: ^/api/user_invitations/verify, roles: PUBLIC_ACCESS }
        - { path: ^/api/user_invitations/complete, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/validate-reset-token, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/reset-password, roles: PUBLIC_ACCESS }
        # Master-data & pricing writes are admin-only. Reads stay open to any
        # authenticated user (the shop/admin apps need them). Order/User/Address/
        # SupportTicket carry their own per-resource security with ownership rules.
        - { path: '^/api/(v1/)?(account_groups|client_product_prices|client|clients|countries|delivery_prices|delivery_types|discounts|documentations|documentation_revisions|documentation_media|fuel_surcharges|import_manual_statuses|import_manual_types|import_manuals|media_items|packaging_prices|payment_types|product_discounts|product_groups|product_product_links|products|tax_types|warehouses)(/|$)', methods: [POST, PUT, PATCH, DELETE], roles: ROLE_ADMIN }
        # Customer-writable resources: require a webshop role. Per-object ownership
        # (own client only) is enforced by ClientOwnershipExtension (addresses,
        # support_tickets), OrderClientExtension + OrderAccessVoter (order_items),
        # and AddressClientProcessor (address.client on write).
        - { path: '^/api/(v1/)?(addresses|support_tickets|order_items)(/|$)', methods: [POST, PUT, PATCH, DELETE], roles: [ROLE_CLIENT, ROLE_CLIENT_ADMIN, ROLE_ADMIN] }
        # Invitations are created by client admins / admins (verify & complete are public, matched above)
        - { path: '^/api/(v1/)?user_invitations(/|$)', methods: [POST, PUT, PATCH, DELETE], roles: [ROLE_CLIENT_ADMIN, ROLE_ADMIN] }
        # Admin-only Excel exports of users/clients (orders export is self-scoped in its controller)
        - { path: '^/api/(users|clients)/export', roles: ROLE_ADMIN }
        # All other API routes require authentication
        - { path: ^/api, roles: ROLE_USER }
