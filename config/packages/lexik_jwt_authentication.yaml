# config/packages/lexik_jwt_authentication.yaml
lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 86400 # 24 hour

    # Configure your encoder
    encoder:
        service: lexik_jwt_authentication.encoder.lcobucci

    # Issue the access token as an HttpOnly cookie so it is not reachable by JS
    # (defends against XSS token theft). Because set_cookies is configured, lexik also
    # removes the token from the JSON response body
    # (remove_token_from_body_when_cookies_used defaults to true).
    set_cookies:
        BEARER:
            lifetime: 86400
            samesite: lax
            path: /
            # http locally, https in prod — driven by JWT_COOKIE_SECURE (.env)
            secure: '%env(bool:JWT_COOKIE_SECURE)%'
            httpOnly: true

    # Read the token from the HttpOnly cookie first; keep the Authorization header
    # extractor enabled for non-browser API clients / backward compatibility.
    token_extractors:
        cookie:
            enabled: true
            name: BEARER
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization

    # User ID claim configuration
    # Uses the 'email' property accessor (getEmail()) to populate the JWT claim
    user_id_claim: email

# The deployed frontend (*.vercel.app) and API (*.cloudwaysapps.com) are different
# sites, so the auth cookie must be SameSite=None there or browsers won't send it
# cross-site. (Env vars can't drive this enum node on Symfony 6.4.) If frontend and
# API ever move under one domain (app./api.starlinger.com), drop this back to lax.
when@prod:
    lexik_jwt_authentication:
        set_cookies:
            BEARER:
                samesite: none
