framework:
    messenger:
        # Failed messages land here after retries are exhausted (inspect with messenger:failed:show)
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            # Domain events (email notifications) — handled by a worker, off the HTTP request path.
            # Run: php bin/console messenger:consume async
            App\Message\OrderCreatedMessage: async
            App\Message\OrderStatusChangedMessage: async
            App\Message\OrderInfoRequestMessage: async
            App\Message\OrderTrackingChangedMessage: async
            App\Message\UserInvitedMessage: async
            # Direct mailer sends (support tickets, password reset) go async too
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async

