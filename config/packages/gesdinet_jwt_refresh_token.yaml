gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken
    ttl: 2592000 # 30 days
    token_parameter_name: refresh_token
    single_use: true
    # Issue/read the refresh token as an HttpOnly cookie (not JS-readable, not in the
    # JSON body). Scoped to the refresh endpoint so it is only sent when refreshing.
    cookie:
        enabled: true
        same_site: lax
        path: /api/token/refresh
        secure: '%env(bool:JWT_COOKIE_SECURE)%'
        http_only: true

# Same reasoning as the BEARER cookie (see lexik_jwt_authentication.yaml): the SPAs call
# the API cross-site (no Vercel proxy anymore), so the refresh cookie must be
# SameSite=None + Partitioned (CHIPS) to survive third-party cookie blocking.
# Partitioned requires Secure => JWT_COOKIE_SECURE must be true in prod.
when@prod:
    gesdinet_jwt_refresh_token:
        cookie:
            same_site: none
            partitioned: true
