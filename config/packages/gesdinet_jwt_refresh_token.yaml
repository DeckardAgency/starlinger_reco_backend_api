gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken
    ttl: 2592000 # 30 days
    token_parameter_name: refresh_token
    single_use: true
    # Issue/read the refresh token as an HttpOnly cookie (not JS-readable, not in the
    # JSON body). Scoped to the refresh endpoint so it is only sent when refreshing.
    cookie:
        enabled: true
        same_site: lax
        path: /api/token/refresh
        secure: '%env(bool:JWT_COOKIE_SECURE)%'
        http_only: true

# Same reasoning as the BEARER cookie (see lexik_jwt_authentication.yaml): the staging
# frontend on *.vercel.app is a different site than the API, so cross-site requests
# only carry the cookie when SameSite=None. Revert to lax once both share one domain.
when@prod:
    gesdinet_jwt_refresh_token:
        cookie:
            same_site: none
