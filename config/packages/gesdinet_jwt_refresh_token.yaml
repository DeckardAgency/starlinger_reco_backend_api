gesdinet_jwt_refresh_token:
    refresh_token_class: App\Entity\RefreshToken
    ttl: 2592000 # 30 days
    token_parameter_name: refresh_token
    single_use: true
    # Issue/read the refresh token as an HttpOnly cookie (not JS-readable, not in the
    # JSON body). Scoped to the refresh endpoint so it is only sent when refreshing.
    cookie:
        enabled: true
        same_site: lax
        path: /api/token/refresh
        secure: '%env(bool:JWT_COOKIE_SECURE)%'
        http_only: true

# Same reasoning as the BEARER cookie (see lexik_jwt_authentication.yaml): the frontend
# proxies /api through its own origin, so the refresh cookie is first-party / same-site.
# SameSite=Lax is correct and, unlike None, does not require Secure (which was dropped
# behind the proxy). Only revert to None if SPA and API are served from different sites.
when@prod:
    gesdinet_jwt_refresh_token:
        cookie:
            same_site: lax
